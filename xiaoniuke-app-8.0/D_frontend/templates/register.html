{% extends "base.html" %}
{% block title %}注册 - 小牛客{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <h2>📝 创建账号</h2>
            <p>加入小牛客，开启编程学习之旅</p>
        </div>

        {% if error %}
        <div class="alert alert-error">❌ {{ error }}</div>
        {% endif %}

        <form method="POST" action="/register" id="register-form">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username"
                       class="form-control" placeholder="至少3个字符"
                       required autocomplete="username"
                       minlength="3">
            </div>

            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password"
                       class="form-control" placeholder="至少6个字符"
                       required autocomplete="new-password"
                       minlength="6">
            </div>

            <div class="form-group">
                <label for="confirm_password">确认密码</label>
                <input type="password" id="confirm_password" name="confirm_password"
                       class="form-control" placeholder="请再次输入密码"
                       required autocomplete="new-password">
            </div>

            <div class="form-group">
                <label for="role">身份选择</label>
                <select id="role" name="role" class="form-control" onchange="toggleTeacherCode()">
                    <option value="student">🧑‍🎓 学生</option>
                    <option value="teacher">👨‍🏫 教师</option>
                </select>
                <span class="form-hint">学生可自由注册，教师注册需要校验码</span>
            </div>

            <div class="form-group" id="teacher-code-group" style="display: none;">
                <label for="teacher_code">🔑 教师校验码</label>
                <input type="text" id="teacher_code" name="teacher_code"
                       class="form-control"
                       placeholder="请输入校方提供的教师校验码">
                <span class="form-hint">请联系学校管理员获取教师校验码</span>
            </div>

            <button type="submit" class="btn btn-primary" style="width:100%;">
                注 册
            </button>
        </form>

        <div class="auth-footer">
            已有账号？<a href="/login">立即登录 →</a>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
    function toggleTeacherCode() {
        var role = document.getElementById('role').value;
        var codeGroup = document.getElementById('teacher-code-group');
        var codeInput = document.getElementById('teacher_code');
        if (role === 'teacher') {
            codeGroup.style.display = 'block';
            codeInput.required = true;
        } else {
            codeGroup.style.display = 'none';
            codeInput.required = false;
            codeInput.value = '';
        }
    }

    // 页面加载时检查初始状态
    document.addEventListener('DOMContentLoaded', function() {
        toggleTeacherCode();
    });
</script>
{% endblock %}
